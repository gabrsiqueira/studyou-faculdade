services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studyou
      POSTGRES_PASSWORD: studyou
      POSTGRES_DB: studyou
    ports:
      - "5432:5432"
    volumes:
      - studyou_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyou"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://studyou:studyou@db:5432/studyou
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  studyou_db_data:
